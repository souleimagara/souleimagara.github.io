<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360"
     role="img" aria-label="Illustration for Bank cashouts and identity">
  <defs>
    <linearGradient id="s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="hsl(250 88% 74%)"/>
      <stop offset="1" stop-color="hsl(190 85% 62%)"/>
    </linearGradient>
    <radialGradient id="g" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="hsl(250 80% 55%)" stop-opacity="0.40"/>
      <stop offset="1" stop-color="hsl(250 80% 55%)" stop-opacity="0"/>
    </radialGradient>
    <pattern id="d" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="hsl(190 60% 70%)" opacity="0.13"/>
    </pattern>
  </defs>
  <rect width="640" height="360" fill="#0b0a17"/>
  <rect width="640" height="360" fill="url(#d)"/>
  <ellipse cx="320" cy="170" rx="300" ry="220" fill="url(#g)"/>

  <!-- phone -->
  <rect x="235" y="34" width="170" height="292" rx="24" fill="hsl(250 40% 12%)"
        stroke="url(#s)" stroke-width="2"/>
  <rect x="295" y="46" width="50" height="7" rx="3.5" fill="hsl(250 40% 22%)"/>

  <!-- header -->
  <text x="258" y="82" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#eceaf6">Cash out</text>
  <circle cx="266" cy="104" r="12" fill="none" stroke="hsl(45 95% 62%)" stroke-width="2"/>
  <path d="M262 97 v14 M260 100 h6 a2.3 2.3 0 0 1 0 5 h-6 M260 105 h7 a2.3 2.3 0 0 1 0 5 h-7"
        stroke="hsl(45 95% 62%)" stroke-width="1.7" fill="none" stroke-linecap="round"/>
  <text x="286" y="109" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#eceaf6">$5.52</text>
  <line x1="256" y1="124" x2="384" y2="124" stroke="hsl(250 40% 26%)" stroke-width="1"/>

  <!-- provider rows -->
  <!-- Plaid -->
  <rect x="254" y="134" width="132" height="42" rx="10" fill="none" stroke="hsl(250 40% 28%)" stroke-width="1.3"/>
  <circle cx="272" cy="155" r="7" fill="hsl(220 85% 62%)"/>
  <text x="288" y="152" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eceaf6">Plaid</text>
  <text x="288" y="166" font-family="Arial, sans-serif" font-size="9.5" fill="hsl(250 25% 70%)">Bank payout · US</text>
  <!-- Tink -->
  <rect x="254" y="182" width="132" height="42" rx="10" fill="none" stroke="hsl(250 40% 28%)" stroke-width="1.3"/>
  <circle cx="272" cy="203" r="7" fill="hsl(165 70% 52%)"/>
  <text x="288" y="200" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eceaf6">Tink</text>
  <text x="288" y="214" font-family="Arial, sans-serif" font-size="9.5" fill="hsl(250 25% 70%)">Bank payout · Europe</text>
  <!-- Onfido -->
  <rect x="254" y="230" width="132" height="42" rx="10" fill="none" stroke="hsl(250 40% 28%)" stroke-width="1.3"/>
  <circle cx="272" cy="251" r="7" fill="hsl(255 85% 68%)"/>
  <text x="288" y="248" font-family="Arial, sans-serif" font-size="12.5" font-weight="700" fill="#eceaf6">Onfido</text>
  <text x="288" y="262" font-family="Arial, sans-serif" font-size="9.5" fill="hsl(250 25% 70%)">Identity check</text>

  <!-- confirm button -->
  <rect x="254" y="282" width="132" height="28" rx="9" fill="url(#s)"/>
  <text x="320" y="301" text-anchor="middle" font-family="Arial, sans-serif" font-size="12"
        font-weight="700" fill="#0b0a17">Withdraw</text>
</svg>
